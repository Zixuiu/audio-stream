<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎵 手机音频传输</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .container { width: 100%; max-width: 420px; padding: 20px; text-align: center; }
        .logo { font-size: 48px; margin-bottom: 8px; }
        .title {
            font-size: 22px; font-weight: 700; margin-bottom: 4px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }
        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: 50px; margin-bottom: 24px;
            font-size: 14px; font-weight: 500; transition: all 0.3s ease;
        }
        .status-bar.disconnected { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .status-bar.connecting { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); color: #fde68a; animation: pulse 1.5s infinite; }
        .status-bar.connected { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: #6ee7b7; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .disconnected .status-dot { background: #ef4444; }
        .connecting .status-dot { background: #fbbf24; animation: pulse 1.5s infinite; }
        .connected .status-dot { background: #34d399; }
        .visualizer-wrapper { width: 200px; height: 200px; margin: 0 auto 24px; position: relative; }
        canvas#visualizer { width: 200px; height: 200px; border-radius: 50%; }
        .visualizer-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; transition: border-color 0.3s; }
        .connected .visualizer-ring { border-color: rgba(52,211,153,0.3); }
        .streaming .visualizer-ring { border-color: rgba(167,139,250,0.5); animation: ring-pulse 2s infinite; }
        @keyframes ring-pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:0.7} }
        .btn-main {
            width: 140px; height: 140px; border-radius: 50%; border: none; cursor: pointer;
            margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
            font-size: 48px; transition: all 0.3s; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-main.start { background: linear-gradient(135deg, #34d399, #059669); }
        .btn-main.start:active { transform: scale(0.95); }
        .btn-main.stop { background: linear-gradient(135deg, #f87171, #dc2626); }
        .btn-main.stop:active { transform: scale(0.95); }
        .btn-label { font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 24px; }
        .volume-bar { width: 80%; max-width: 300px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 0 auto 20px; overflow: hidden; }
        .volume-fill { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, #34d399, #a78bfa, #f87171); transition: width 0.05s linear; }
        .info-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; }
        .info-row .label { color: #64748b; }
        .info-row .value { color: #e2e8f0; font-weight: 500; font-variant-numeric: tabular-nums; }
        .tips { font-size: 11px; color: #475569; line-height: 1.6; }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(30,27,75,0.95); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 10px 20px; font-size: 13px; color: #e2e8f0;
            z-index: 1000; transition: transform 0.3s ease; backdrop-filter: blur(10px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.success { border-color: rgba(52,211,153,0.3); color: #6ee7b7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1 class="title">手机音频传输</h1>
        <p class="subtitle">将手机音频实时传输到电脑播放</p>

        <div id="statusBar" class="status-bar disconnected">
            <span class="status-dot"></span>
            <span id="statusText">未连接</span>
        </div>

        <div class="visualizer-wrapper" id="vizWrapper">
            <div class="visualizer-ring"></div>
            <canvas id="visualizer" width="400" height="400"></canvas>
        </div>

        <button id="mainBtn" class="btn-main start" onclick="toggleStream()">🎤</button>
        <p class="btn-label" id="btnLabel">点击开始传输</p>

        <div class="volume-bar">
            <div class="volume-fill" id="volumeFill"></div>
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="label">采样率</span>
                <span class="value" id="sampleRateDisplay">44100 Hz</span>
            </div>
            <div class="info-row">
                <span class="label">已传输</span>
                <span class="value" id="bytesDisplay">0 KB</span>
            </div>
            <div class="info-row">
                <span class="label">传输时长</span>
                <span class="value" id="durationDisplay">00:00</span>
            </div>
        </div>

        <p class="tips">
            💡 确保手机和电脑在同一局域网下<br>
            📱 建议使用 Chrome / Edge 浏览器打开<br>
            🔊 传输时手机靠近音源效果最佳
        </p>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ==================== 全局状态 ====================
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let sourceNode = null;
        let analyser = null;
        let scriptNode = null;
        let isStreaming = false;
        let totalBytes = 0;
        let startTime = 0;
        let durationTimer = null;
        let animFrameId = null;

        // ==================== 配置 ====================
        // bufferSize 越大，每次发送的数据越多，网络开销越小，但延迟略增
        // 4096 = 约 93ms 一包，是流畅和延迟的平衡点
        const BUFFER_SIZE = 4096;

        // ==================== WebSocket ====================
        function getWsUrl() {
            const loc = window.location;
            const protocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
            return protocol + '//' + loc.hostname + ':8766';
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type || '') + ' show';
            setTimeout(function() { t.classList.remove('show'); }, 2500);
        }

        function setStatus(state, text) {
            document.getElementById('statusBar').className = 'status-bar ' + state;
            document.getElementById('statusText').textContent = text;
        }

        function connectWebSocket() {
            setStatus('connecting', '正在连接...');
            try { ws = new WebSocket(getWsUrl()); }
            catch (e) { setStatus('disconnected', '连接失败'); return; }

            ws.binaryType = 'arraybuffer';

            ws.onopen = function() {
                setStatus('connected', '已连接');
                showToast('已连接到电脑', 'success');
            };

            ws.onclose = function() {
                setStatus('disconnected', '已断开');
                if (isStreaming) stopStreaming();
                setTimeout(function() {
                    if (!ws || ws.readyState === WebSocket.CLOSED) connectWebSocket();
                }, 3000);
            };

            ws.onerror = function() {
                setStatus('disconnected', '连接错误');
                showToast('连接出错', 'error');
            };
        }

        // ==================== 开始传输 ====================
        async function startStreaming() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('请先连接到电脑', 'error');
                return;
            }

            try {
                // 请求麦克风（关闭所有音频处理，获取最原始的声音）
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    }
                });

                // 使用设备原生采样率，避免重采样导致卡顿
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaStreamSource(mediaStream);

                // 可视化分析器
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                sourceNode.connect(analyser);

                // ScriptProcessor：兼容性最好，Android Chrome 完美支持
                // bufferSize=4096 约等于 93ms@44100Hz，平衡流畅度和延迟
                scriptNode = audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);
                sourceNode.connect(scriptNode);
                // 关键：不连接 destination，避免手机自己播放产生回声

                scriptNode.onaudioprocess = function(e) {
                    if (!isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;

                    var inputData = e.inputBuffer.getChannelData(0);
                    var len = inputData.length;

                    // Float32 → Int16 PCM（手动转换，避免 TypedArray 开销）
                    var pcm16 = new Int16Array(len);
                    for (var i = 0; i < len; i++) {
                        var s = inputData[i];
                        if (s > 1) s = 1;
                        else if (s < -1) s = -1;
                        pcm16[i] = s < 0 ? (s * 32768) | 0 : (s * 32767) | 0;
                    }

                    ws.send(pcm16.buffer);
                    totalBytes += len * 2;
                };

                isStreaming = true;
                startTime = Date.now();
                updateDuration();
                startVisualization();

                document.getElementById('mainBtn').className = 'btn-main stop';
                document.getElementById('mainBtn').textContent = '⏹';
                document.getElementById('btnLabel').textContent = '点击停止传输';
                document.getElementById('vizWrapper').classList.add('streaming');

                ws.send(JSON.stringify({ type: 'start' }));
                showToast('开始传输音频', 'success');

            } catch (err) {
                console.error('麦克风访问失败:', err);
                if (err.name === 'NotAllowedError') {
                    showToast('请允许麦克风权限', 'error');
                } else if (err.name === 'NotFoundError') {
                    showToast('未检测到麦克风', 'error');
                } else {
                    showToast('启动失败: ' + err.message, 'error');
                }
            }
        }

        // ==================== 停止传输 ====================
        function stopStreaming() {
            isStreaming = false;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
            }

            if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
            if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(function(t) { t.stop(); }); mediaStream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
            if (durationTimer) { clearInterval(durationTimer); durationTimer = null; }

            document.getElementById('mainBtn').className = 'btn-main start';
            document.getElementById('mainBtn').textContent = '🎤';
            document.getElementById('btnLabel').textContent = '点击开始传输';
            document.getElementById('vizWrapper').classList.remove('streaming');
            document.getElementById('volumeFill').style.width = '0%';

            showToast('已停止传输');
        }

        function toggleStream() {
            if (isStreaming) stopStreaming();
            else startStreaming();
        }

        // ==================== 可视化 ====================
        function startVisualization() {
            var canvas = document.getElementById('visualizer');
            var ctx = canvas.getContext('2d');
            var W = canvas.width, H = canvas.height;
            var cx = W / 2, cy = H / 2;

            function draw() {
                if (!isStreaming || !analyser) return;
                animFrameId = requestAnimationFrame(draw);

                var bufLen = analyser.frequencyBinCount;
                var data = new Uint8Array(bufLen);
                analyser.getByteFrequencyData(data);

                var sum = 0;
                for (var i = 0; i < bufLen; i++) sum += data[i];
                var avg = sum / bufLen;
                document.getElementById('volumeFill').style.width = Math.min(100, (avg / 128) * 100) + '%';

                ctx.clearRect(0, 0, W, H);

                var bars = 64, step = Math.floor(bufLen / bars);
                var baseR = 60, maxH = 80;

                for (var i = 0; i < bars; i++) {
                    var val = data[i * step] / 255;
                    var h = val * maxH;
                    var angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
                    var x1 = cx + Math.cos(angle) * baseR;
                    var y1 = cy + Math.sin(angle) * baseR;
                    var x2 = cx + Math.cos(angle) * (baseR + h);
                    var y2 = cy + Math.sin(angle) * (baseR + h);
                    var hue = (i / bars) * 120 + 160;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = 'hsla(' + hue + ',80%,65%,' + (0.4 + val * 0.6) + ')';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                var cr = baseR - 10 + (avg / 255) * 8;
                var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
                grad.addColorStop(0, 'rgba(167,139,250,0.3)');
                grad.addColorStop(1, 'rgba(167,139,250,0.05)');
                ctx.beginPath();
                ctx.arc(cx, cy, cr, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                document.getElementById('bytesDisplay').textContent = (totalBytes / 1024).toFixed(1) + ' KB';
            }
            draw();
        }

        function updateDuration() {
            durationTimer = setInterval(function() {
                if (!isStreaming) return;
                var elapsed = Math.floor((Date.now() - startTime) / 1000);
                var m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                var s = String(elapsed % 60).padStart(2, '0');
                document.getElementById('durationDisplay').textContent = m + ':' + s;
            }, 1000);
        }

        // ==================== 初始化 ====================
        window.addEventListener('load', function() {
            connectWebSocket();
            var canvas = document.getElementById('visualizer');
            var ctx = canvas.getContext('2d');
            var grad = ctx.createRadialGradient(200, 200, 0, 200, 200, 60);
            grad.addColorStop(0, 'rgba(167,139,250,0.15)');
            grad.addColorStop(1, 'rgba(167,139,250,0.02)');
            ctx.beginPath();
            ctx.arc(200, 200, 60, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
        });

        window.addEventListener('beforeunload', function() {
            if (isStreaming) stopStreaming();
            if (ws) ws.close();
        });
    </script>
</body>
</html>
